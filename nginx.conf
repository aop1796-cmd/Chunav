server {
    listen 8080;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/nvidia/ {
        proxy_pass https://integrate.api.nvidia.com/;
        proxy_set_header Host integrate.api.nvidia.com;
        proxy_ssl_server_name on;
    }
}
